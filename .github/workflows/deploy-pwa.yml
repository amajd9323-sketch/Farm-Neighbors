name: Deploy Farm Neighbors PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FarmNeighbors-Web-MVP.zip'
      - 'FarmNeighbors_Web_Project/web/**'
      - '.github/workflows/deploy-pwa.yml'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PWA site
        run: |
          rm -rf extracted site
          mkdir -p extracted site
          unzip -q FarmNeighbors-Web-MVP.zip -d extracted
          test -f extracted/FarmNeighbors_Web_Project/web/index.html
          cp -a extracted/FarmNeighbors_Web_Project/web/. site/
          # Overlay repository-side public config without modifying the source archive.
          cp -a FarmNeighbors_Web_Project/web/. site/
          # Fix DOM ID mapping: HTML IDs use kebab-case, while app code uses camelCase.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("site/app.js")
          source = path.read_text()
          old = "].map(id => [id, document.getElementById(id)]));"
          new = "].map(id => [id.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase()), document.getElementById(id)]));"
          if old not in source:
              raise SystemExit("Expected UI ID mapping not found; refusing to deploy unpatched app.")
          path.write_text(source.replace(old, new, 1))
          PY
          node --check site/app.js
          touch site/.nojekyll
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          find site -maxdepth 2 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
