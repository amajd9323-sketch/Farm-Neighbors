name: Deploy Farm Neighbors PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FarmNeighbors-Web-MVP.zip'
      - '.github/workflows/deploy-pwa.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare PWA site
        run: |
          rm -rf extracted site
          mkdir -p extracted site
          unzip -q FarmNeighbors-Web-MVP.zip -d extracted
          test -f extracted/FarmNeighbors_Web_Project/web/index.html
          cp -a extracted/FarmNeighbors_Web_Project/web/. site/
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          find site -maxdepth 2 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
