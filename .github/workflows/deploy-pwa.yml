name: Deploy Farm Neighbors PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FarmNeighbors-Web-MVP.zip'
      - 'FarmNeighbors_Web_Project/web/**'
      - '.github/workflows/deploy-pwa.yml'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PWA site
        run: |
          rm -rf extracted site
          mkdir -p extracted site
          unzip -q FarmNeighbors-Web-MVP.zip -d extracted
          test -f extracted/FarmNeighbors_Web_Project/web/index.html
          cp -a extracted/FarmNeighbors_Web_Project/web/. site/
          # Overlay repository-side public config without modifying the source archive.
          cp -a FarmNeighbors_Web_Project/web/. site/
          # Fix DOM ID mapping: HTML IDs use kebab-case, while app code uses camelCase.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("site/app.js")
          source = path.read_text()
          old = "].map(id => [id, document.getElementById(id)]));"
          new = "].map(id => [id.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase()), document.getElementById(id)]));"
          if old not in source:
              raise SystemExit("Expected UI ID mapping not found; refusing to deploy unpatched app.")
          source = source.replace(old, new, 1)
          old_locale = "let locale = localStorage.getItem('farm-neighbors-language') || ((navigator.language || 'en').toLowerCase().startsWith('ar') ? 'ar' : 'en');"
          new_locale = "let locale = localStorage.getItem('farm-neighbors-language') || ((navigator.language || 'en').toLowerCase().startsWith('ar') ? 'ar' : ((navigator.language || 'en').toLowerCase().startsWith('id') ? 'id' : 'en'));"
          if old_locale not in source:
              raise SystemExit("Expected locale initialization not found.")
          source = source.replace(old_locale, new_locale, 1)
          source = source.replace("locale = nextLocale === 'ar' ? 'ar' : 'en';", "locale = ['ar', 'en', 'id'].includes(nextLocale) ? nextLocale : 'en';", 1)
          source = source.replace("new Intl.NumberFormat(locale === 'ar' ? 'ar' : 'en')", "new Intl.NumberFormat(locale === 'ar' ? 'ar' : (locale === 'id' ? 'id-ID' : 'en'))", 1)
          source = source.replace("ui.langToggle.textContent = locale === 'ar' ? 'EN' : 'ع';", "ui.langToggle.textContent = locale === 'ar' ? 'EN' : (locale === 'en' ? 'ID' : 'ع');", 1)
          source = source.replace("ui.langToggle.addEventListener('click', () => setLocale(locale === 'ar' ? 'en' : 'ar'));", "ui.langToggle.addEventListener('click', () => setLocale(({ ar: 'en', en: 'id', id: 'ar' })[locale] || 'en'));", 1)
          path.write_text(source)
          sw = Path("site/sw.js")
          worker = sw.read_text()
          if "farm-neighbors-pwa-v1" not in worker:
              raise SystemExit("Expected service-worker cache version not found.")
          worker = worker.replace("farm-neighbors-pwa-v1", "farm-neighbors-pwa-v9", 1)
          if "'./locales/id.json'" not in worker:
              worker = worker.replace("'./locales/en.json'", "'./locales/en.json', './locales/id.json'", 1)
          sw.write_text(worker)
          PY
          node --check site/app.js
          # Add the independent farm expansion module to the published app.
          python3 - <<'PY'
          from pathlib import Path
          page = Path("site/index.html")
          html = page.read_text()
          tag = '<script src="./farm-expansion.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Cannot inject farm expansion: </body> not found.")
              html = html.replace("</body>", tag + "\n</body>", 1)
          page.write_text(html)
          sw = Path("site/sw.js")
          worker = sw.read_text()
          if "'./locales/id.json'" not in worker:
              raise SystemExit("Indonesian locale cache entry missing.")
          if "'./farm-expansion.js'" not in worker:
              worker = worker.replace("'./locales/id.json'", "'./locales/id.json', './farm-expansion.js'", 1)
          worker = worker.replace(", './farm-world-3d.js'", "").replace("'./farm-world-3d.js', ", "").replace("'./farm-world-3d.js'", "")
          html = html.replace('<script src="./farm-world-3d.js"></script>', '')
          sw.write_text(worker)
          PY
          node --check site/farm-expansion.js
          # Add barn and livestock gameplay (stage 4).
          python3 - <<'PY'
          from pathlib import Path
          page = Path("site/index.html")
          html = page.read_text()
          tag = '<script src="./farm-animals.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Cannot inject livestock module: </body> not found.")
              html = html.replace("</body>", tag + "\n</body>", 1)
          page.write_text(html)
          sw = Path("site/sw.js")
          worker = sw.read_text()
          if "'./farm-animals.js'" not in worker:
              worker = worker.replace("'./farm-expansion.js'", "'./farm-expansion.js', './farm-animals.js'", 1)
          sw.write_text(worker)
          PY
          node --check site/farm-animals.js
          # Add customer contracts and produce deliveries (stage 5).
          python3 - <<'PY'
          from pathlib import Path
          page = Path("site/index.html")
          html = page.read_text()
          tag = '<script src="./farm-orders.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Cannot inject order board: </body> not found.")
              html = html.replace("</body>", tag + "\n</body>", 1)
          page.write_text(html)
          sw = Path("site/sw.js")
          worker = sw.read_text()
          if "'./farm-orders.js'" not in worker:
              worker = worker.replace("'./farm-animals.js'", "'./farm-animals.js', './farm-orders.js'", 1)
          sw.write_text(worker)
          PY
          node --check site/farm-animals.js
          node --check site/farm-orders.js
          touch site/.nojekyll
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          find site -maxdepth 2 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
